name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Run tests
        run: uv run pytest -q

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: uv build --wheel

      - name: Install wheel into clean venv (no dev deps)
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl

      - name: Scaffold smoke (import + console script)
        run: |
          /tmp/smoke-venv/bin/python -c "import gamecollect; print(gamecollect.__version__)"
          /tmp/smoke-venv/bin/gamecollect
